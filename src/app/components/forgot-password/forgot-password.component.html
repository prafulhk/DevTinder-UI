<div class="flex flex-col justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
        <div *ngIf="!otpSent">
            <h2 class="text-2xl font-bold mb-4 text-center">Forgot Password</h2>
            <p class="mb-4 text-center">Please click on the send email button to reset your password.</p>
            <div class="w-full rounded-lg bg-blue-500 mt-4 text-white text-lg font-semibold">
                <button type="button" class="w-full p-4" (click)="sendEmail()">Send Email</button>
            </div>
        </div>

        <div *ngIf="otpSent">
            <form [formGroup]="otpForm">
                <div class="mt-6">
                    <label for="otp" class="block text-sm font-medium text-gray-700 text-center">Enter OTP</label>
                    <div class="flex justify-center space-x-2 mt-2">
                        <input type="text" maxlength="1" formControlName="firstDigit"
                            class="w-12 h-12 text-center border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            placeholder="0">
                        <input type="text" maxlength="1" formControlName="secondDigit"
                            class="w-12 h-12 text-center border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            placeholder="0"> 
                        <input type="text" maxlength="1" formControlName="thirdDigit"
                            class="w-12 h-12 text-center border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            placeholder="0">
                        <input type="text" maxlength="1" formControlName="fourthDigit"
                            class="w-12 h-12 text-center border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            placeholder="0">
                    </div>
                </div>
                <div class="w-full rounded-lg bg-green-500 mt-4 text-white text-lg font-semibold">
                    <button type="button" class="w-full p-4" (click)="verifyOtp()">Verify OTP</button>
                </div>
            </form>
        </div>
    </div>
</div>
